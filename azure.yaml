name: pizza-ordering

services:
  pizza-web:
    project: ./src/Pizza.Web
    language: csharp
    host: containerapp
    docker:
      path: ./Dockerfile

  pizza-ordering-agent-copilot:
    project: .
    host: azure.ai.agent
    kind: prompt
    name: pizza-ordering-agent-copilot
    model: gpt-5-mini
    instructions: |
      You are the pizza ordering assistant. Help customers browse the live pizza
      catalog, discuss food and wine pairings, and place delivery orders.

      Always fetch the catalog before making recommendations or creating an
      order. Only recommend items that are marked available. Use the exact
      pizzaId and current catalog price when submitting an order; the backend
      recalculates and snapshots the price. Collect the customer's name,
      delivery address, pizza selection, and quantity, then summarize the
      complete order and get the customer's explicit confirmation before
      calling the order-creation operation. Never claim an order was placed
      unless the API returns a successful response and order ID.

      For wine-pairing questions, use the available web search capability and
      explain that pairings are suggestions. Do not invent allergy or dietary
      safety guarantees. The current web search is a temporary substitute for
      the unspecified WebIQ API; do not claim to be connected to WebIQ.
    harness:
      type: microsoft_copilot_preview
    tools:
      - type: microsoft_copilot_toolset_preview
        defaultConfig:
          enabled: false
      - type: openapi
        openapi:
          name: pizza-catalog
          description: Read the live pizza catalog before recommendations or orders.
          spec:
            openapi: 3.0.3
            info:
              title: Pizza Catalog
              version: 1.0.0
            servers:
              - url: https://pizza-catalog.proudflower-ac7d0444.swedencentral.azurecontainerapps.io
            paths:
              /api/catalog/pizzas:
                get:
                  operationId: listPizzas
                  summary: List the current pizza menu
                  responses:
                    "200":
                      description: Current menu with prices and availability.
                      content:
                        application/json:
                          schema:
                            type: array
                            items:
                              type: object
                              required: [id, name, description, price, imageUrl, isAvailable]
                              properties:
                                id: { type: string, format: uuid }
                                name: { type: string }
                                description: { type: string }
                                price: { type: number, format: double }
                                imageUrl: { type: string }
                                isAvailable: { type: boolean }
                    "503":
                      description: Rate limit or service unavailable; do not invent results.
          auth:
            type: project_connection
            security_scheme:
              project_connection_id: /subscriptions/80214fc0-7aff-43b6-bbff-cf81a36cbb10/resourceGroups/rg-jjazure-ai-pizza-apps/providers/Microsoft.CognitiveServices/accounts/ai-pizza-22df-k5ihazv/projects/pizza-ordering-agent/connections/pizza-catalog
      - type: openapi
        openapi:
          name: pizza-orders
          description: Create a confirmed synthetic demo delivery order.
          spec:
            openapi: 3.0.3
            info:
              title: Pizza Orders
              version: 1.0.0
            servers:
              - url: https://pizza-orders.proudflower-ac7d0444.swedencentral.azurecontainerapps.io
            paths:
              /api/orders/:
                post:
                  operationId: createDeliveryOrder
                  description: Submit only after explicit user confirmation.
                  summary: Place an order
                  requestBody:
                    required: true
                    content:
                      application/json:
                        schema:
                          type: object
                          required: [customerName, customerAddress, items]
                          properties:
                            customerName: { type: string, minLength: 1, maxLength: 120 }
                            customerAddress: { type: string, minLength: 1, maxLength: 500 }
                            items:
                              type: array
                              minItems: 1
                              maxItems: 20
                              items:
                                type: object
                                required: [pizzaId, quantity]
                                properties:
                                  pizzaId: { type: string, format: uuid }
                                  quantity: { type: integer, minimum: 1, maximum: 50 }
                  responses:
                    "201":
                      description: Order created with the real ID and current price snapshot.
                      content:
                        application/json:
                          schema:
                            type: object
                            required: [id, customer, items, status, createdAt, total]
                            properties:
                              id: { type: string, format: uuid }
                              customer:
                                type: object
                                properties:
                                  name: { type: string }
                                  address: { type: string }
                              items:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    pizzaId: { type: string, format: uuid }
                                    pizzaName: { type: string }
                                    unitPrice: { type: number }
                                    quantity: { type: integer }
                                    lineTotal: { type: number }
                              status:
                                type: string
                                enum: [New, Preparing, OutForDelivery, Completed]
                              createdAt: { type: string, format: date-time }
                              total: { type: number }
                    "400":
                      description: Invalid customer, unavailable pizza or quantity.
                    "503":
                      description: Rate limit or service unavailable; unknown delivery must not be retried.
          auth:
            type: project_connection
            security_scheme:
              project_connection_id: /subscriptions/80214fc0-7aff-43b6-bbff-cf81a36cbb10/resourceGroups/rg-jjazure-ai-pizza-apps/providers/Microsoft.CognitiveServices/accounts/ai-pizza-22df-k5ihazv/projects/pizza-ordering-agent/connections/pizza-orders
      - type: web_search
    skills:
      - name: pizza-ordering-guidance
        version: "1"

hooks:
  prepackage:
    windows:
      shell: pwsh
      run: dotnet publish .\src\Pizza.Web\Pizza.Web.csproj --configuration Release --output .\src\Pizza.Web\container-publish
    posix:
      shell: sh
      run: dotnet publish ./src/Pizza.Web/Pizza.Web.csproj --configuration Release --output ./src/Pizza.Web/container-publish
  postprovision:
    windows:
      shell: pwsh
      run: ./scripts/provision-sql.ps1
    posix:
      shell: sh
      run: ./scripts/provision-sql.sh
